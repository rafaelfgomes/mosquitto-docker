persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Configurações Globais de Segurança
allow_anonymous false
password_file /tmp/passwd

# Listener 1: MQTT Padrão (para o Zigbee2MQTT)
listener 1883
protocol mqtt

# Listener 2: WebSockets (para dashboards e apps web)
listener 9001
protocol websockets
