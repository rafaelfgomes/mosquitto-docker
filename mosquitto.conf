# =====================================================================
# General Settings
# =====================================================================
# Save process ID to a file
pid_file /run/mosquitto/mosquitto.pid

# Provide persistent storage so messages/subscriptions survive a restart
persistence true
persistence_location /var/lib/mosquitto/

# =====================================================================
# Logging
# =====================================================================
# Send log messages to both standard output (console) and a log file
log_dest stderr
log_dest file /var/log/mosquitto/mosquitto.log

# Choose what to log (helpful for troubleshooting)
log_type error
log_type warning
log_type notice
log_type information

# =====================================================================
# Security & Authentication
# =====================================================================

# Path to the encrypted username/password file
password_file /etc/mosquitto/passwd

# =====================================================================
# Listeners (Ports)
# =====================================================================

# Listener 1: Standard MQTT (Default protocol)
listener 1883 0.0.0.0

# Listener 2: WebSockets (Useful for web applications/dashboards)
listener 9001 0.0.0.0
protocol websockets

# Turn off unauthenticated, anonymous access globally
listener_allow_anonymous false
