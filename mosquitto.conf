# =====================================================================
# General Settings
# =====================================================================
# No Docker, você pode comentar ou remover o pid_file, pois o Docker já gerencia o ciclo de vida
# pid_file /var/run/mosquitto/mosquitto.pid

# Caminho corrigido para a pasta mapeada no seu Docker Compose
persistence true
persistence_location /mosquitto/data/

# =====================================================================
# Logging
# =====================================================================
# Caminho corrigido para a pasta mapeada no seu Docker Compose
log_dest stderr
log_dest file /mosquitto/log/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information

# =====================================================================
# Security & Authentication
# =====================================================================
# ATENÇÃO: Verifique onde está seu arquivo 'passwd'.
# Se ele estiver dentro da sua pasta 'config', mude o caminho para:
password_file /mosquitto/config/passwd

# =====================================================================
# Listeners (Ports)
# =====================================================================
listener 1883 0.0.0.0

listener 9001 0.0.0.0
protocol websockets

listener_allow_anonymous false
